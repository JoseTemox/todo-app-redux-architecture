<footer class="footer">
  <span class="todo-count"
    ><strong>{{ pending }}</strong> Pending Task</span
  >
  <ul class="filters">
    <li *ngFor="let filter of filters" (click)="changeFilter(filter)">
      <a [class.selected]="filter === currentFilter">{{
        filter.toUpperCase() | titlecase
      }}</a>
    </li>
  </ul>
  <button class="clear-completed" (click)="clearCompleted()">
    Clear Completed
  </button>
</footer>
